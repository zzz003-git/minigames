<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- easy2Njoy favicon (2026-09-10) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#E07A1F">
  <link rel="manifest" href="/site.webmanifest">
  <title>링 스톱</title>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#261638">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body class="game game--accent-mint game--ringstop">
  <script src="../../shared/splash.js"></script>
  <div class="app">
    <header class="topbar" id="header"></header>

    <main class="app__body">

      <!-- 시작 -->
      <section class="screen is-active" data-screen="ready">
        <div class="card card--accent card--center card--hero">
          <div class="card__label card__label--mono">RING STOP</div>
          <div class="headline">밝은 구간에서 탭</div>
          <p class="footnote">라운드마다 점이 빨라지고 구간이 좁아집니다. 한 번 놓치면 끝!</p>
        </div>

        <div class="stats">
          <div class="stat stat--accent">
            <div class="stat__label">최고 연속</div>
            <div class="stat__value" id="bestValue">—</div>
          </div>
          <div class="stat">
            <div class="stat__label">플레이</div>
            <div class="stat__value" id="playsValue">—</div>
          </div>
        </div>

        <button class="btn btn--primary" id="startBtn" disabled>▶ 시작하기</button>

        <div class="card card--info">
          <div class="meter">
            <div class="meter__text">
              <span class="card__label">오늘 남은 도전</span>
              <span class="figure figure--md" id="attemptText">—</span>
            </div>
            <div class="pips" id="attemptDots"></div>
          </div>
        </div>

        <div id="adbar"></div>
      </section>

      <!-- 플레이 -->
      <section class="screen" data-screen="play">
        <div class="hud">
          <div class="hud__item">
            <span class="hud__label">STREAK</span>
            <span class="hud__value" id="hudStreak">0</span>
          </div>
          <div class="lives" id="hudLives"></div>
          <div class="hud__item hud__item--right">
            <span class="hud__label">속도</span>
            <span class="hud__value hud__value--accent" id="hudSpeed">—</span>
          </div>
        </div>

        <div class="stage stage--flat">
          <button class="ring-stage" id="ring" type="button" aria-label="지금 멈추기">
            <svg viewBox="0 0 200 200" aria-hidden="true">
              <!-- 관람차 바퀴 — 목표 호가 늘 아래 탑승장에 오도록 바퀴째 돌립니다(REQ-56 §3-1).
                   돌리는 것은 #wheel 의 CSS transform 하나뿐이고 **즉시** 적용합니다.
                   #ringTarget·#ringDot 에는 CSS transform 을 주지 않습니다(위치를 정하는 속성이 덮입니다) -->
              <g id="wheel">
                <g class="rs-spokes">
                  <line x1="100" y1="20" x2="100" y2="180"/><line x1="20" y1="100" x2="180" y2="100"/>
                  <line x1="43.4" y1="43.4" x2="156.6" y2="156.6"/><line x1="156.6" y1="43.4" x2="43.4" y2="156.6"/>
                </g>
                <circle class="ring-track" cx="100" cy="100" r="80"></circle>
                <circle class="ring-target" id="ringTarget" cx="100" cy="100" r="80"></circle>
                <circle class="rs-bulbs" id="ringBulbs" cx="100" cy="100" r="80"></circle>
                <circle class="ring-dot" id="ringDot" cx="100" cy="20" r="9"></circle>
              </g>
              <!-- 탑승장 — 바퀴 밖, 늘 6시 자리에 고정 -->
              <path class="rs-platform" d="M78 194 H122 L118 199 H82 Z"/>
            </svg>
            <span class="ring-stage__center">
              <span class="ring-stage__label">TAP</span>
              <span class="ring-stage__value" id="ringRound">1</span>
            </span>
          </button>
        </div>

        <div class="footnote--dim center">점이 밝은 구간에 들어왔을 때 원을 탭하세요</div>
      </section>

      <!-- 목숨 소진 -->
      <section class="screen" data-screen="pause">
        <div class="card card--center card--hero">
          <div class="badge-round badge-round--quiet" aria-hidden="true">💔</div>
          <div class="headline">아깝다!</div>
          <div class="footnote" id="pauseSub">—</div>
          <div class="figure figure--result" id="pauseFigure">—</div>
        </div>

        <div id="adbarBoost"></div>
        <button class="btn" id="pauseEndBtn">여기서 끝내고 결과 보기</button>
      </section>

      <!-- 결과 -->
      <section class="screen" data-screen="over">
        <div class="card card--accent card--center card--hero celebrate" id="overCard">
          <div class="badge-round" id="overBadge" aria-hidden="true">🎮</div>
          <div class="headline" id="overHeadline">—</div>
          <div class="footnote" id="overSub">—</div>
          <div class="figure figure--result" id="overFigure">—</div>
          <div class="chips" id="overChips"></div>
          <div class="stats stats--inset" id="overTiles"></div>
        </div>

        <button class="btn btn--primary" id="retryBtn">다시 도전하기</button>
        <div id="adbarStats"></div>
        <div class="footnote--dim center" id="overNote"></div>
      </section>

      <!-- 전체 순위 -->
      <section class="screen" data-screen="stats">
        <div class="card">
          <div class="card__head">
            <span class="card__title" id="statsTitle">전체 통계</span>
          </div>
          <div id="statsChart"></div>
          <div class="stats mt-md" id="statsTiles"></div>
        </div>

        <div class="card card--info">
          <div class="card__label">TOP 20</div>
          <div class="rank-list mt-sm" id="statsRank"></div>
        </div>

        <div class="card card--info">
          <div class="card__label">리그별 기록 수</div>
          <div class="rank-list mt-sm" id="statsLeagues"></div>
        </div>

        <button class="btn" id="statsBackBtn">← 결과로 돌아가기</button>
      </section>

    </main>
  </div>

  <script type="module" src="game.js"></script>
  <script type="module" src="../../shared/bgm.js"></script>
</body>
</html>
