<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- easy2Njoy favicon (2026-09-10) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#E07A1F">
  <link rel="manifest" href="/site.webmanifest">
  <title>슥슥 긁기</title>
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#EEE5FA">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Stylish&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="../../shared/theme-light.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body class="game game--accent-gold game--scratch theme-light">
  <script src="../../shared/splash.js"></script>
  <div class="app">
    <header class="topbar" id="header"></header>

    <main class="app__body">

      <!-- 시작 -->
      <section class="screen is-active" data-screen="ready">
        <div class="card card--accent card--center card--hero">
          <div class="card__label card__label--mono">TODAY'S CARD</div>
          <div class="headline">오늘 카드가 도착했어요</div>
          <p class="footnote">9칸 중 <b>5칸</b>을 문질러 긁습니다.<br>
            같은 그림 <b>3개</b>가 모이면 획득 포인트가 <b>2배</b>.</p>
        </div>

        <div class="stats">
          <div class="stat stat--accent">
            <div class="stat__label">최장 연속</div>
            <div class="stat__value" id="bestValue">—</div>
          </div>
          <div class="stat">
            <div class="stat__label">긁은 카드</div>
            <div class="stat__value" id="playsValue">—</div>
          </div>
        </div>

        <button class="btn btn--primary" id="startBtn" disabled>▶ 카드 긁기</button>

        <div class="card card--info">
          <div class="meter">
            <div class="meter__text">
              <span class="card__label">오늘 남은 카드</span>
              <span class="figure figure--md" id="attemptText">—</span>
            </div>
            <div class="pips" id="attemptDots"></div>
          </div>
          <p class="footnote--dim mt-sm">카드는 매일 밤 12시에 새로 도착합니다.
            광고로 카드를 더 받을 수는 없어요.</p>
        </div>

        <div id="adbar"></div>
      </section>

      <!-- 플레이 -->
      <section class="screen" data-screen="play">
        <div class="hud">
          <div class="hud__item">
            <span class="hud__label">획득 포인트</span>
            <span class="hud__value hud__value--accent" id="hudScore">0</span>
          </div>
          <div class="hud__item">
            <span class="hud__label">연속</span>
            <span class="hud__value" id="hudStreak">1일</span>
            <!-- 연속 일수 7칸 달력 — 숫자(#hudStreak)는 그대로 두고 보조로 그린다. 7일째가 완전 공개 힌트라 7칸 단위 -->
            <span class="sc-cal" id="hudCal" role="img" aria-label="연속 1일"></span>
          </div>
          <div class="hud__item hud__item--right">
            <span class="hud__label">남은 긁기</span>
            <span class="hud__value" id="hudLeft">5</span>
          </div>
        </div>

        <!-- 은박 카드 -->
        <div class="card card--center scratchcard" id="cardBox">
          <!-- 선물 카드 리본 — 장식(생성 그림 ribbon_bow 는 47px 판정 뒤 교체) -->
          <svg class="sc-ribbon" viewBox="0 0 64 56" aria-hidden="true" focusable="false">
            <path d="M32 26 C22 10 6 8 6 20 C6 30 20 30 32 26Z" fill="#8B5CD6" stroke="#5B32A0" stroke-width="2.5"/>
            <path d="M32 26 C42 10 58 8 58 20 C58 30 44 30 32 26Z" fill="#8B5CD6" stroke="#5B32A0" stroke-width="2.5"/>
            <path d="M29 28 L20 52 L27 48 L31 54 L33 30Z" fill="#7646C7" stroke="#5B32A0" stroke-width="2"/>
            <path d="M35 28 L44 52 L37 48 L33 54 L31 30Z" fill="#7646C7" stroke="#5B32A0" stroke-width="2"/>
            <circle cx="32" cy="26" r="6" fill="#A57CE8" stroke="#5B32A0" stroke-width="2.5"/>
          </svg>
          <div class="scratchcard__head">
            <span class="scratchcard__label" id="cardLabel">같은 그림 3개를 모으세요</span>
            <span class="scratchcard__match" id="cardMatch"></span>
          </div>
          <div class="scratchgrid" id="grid"></div>
        </div>

        <p class="footnote center" id="playHint">손가락으로 칸을 <b>슥슥</b> 문질러 주세요</p>
      </section>

      <!-- 긁기 소진 — 구원 광고 (기획서 8장) -->
      <section class="screen" data-screen="pause">
        <div class="card card--center card--hero">
          <div class="badge-round badge-round--quiet" aria-hidden="true">✨</div>
          <div class="headline" id="pauseHeadline">카드를 다 긁었어요</div>
          <div class="footnote" id="pauseSub">—</div>
          <div class="figure figure--result" id="pauseFigure">—</div>
        </div>

        <div id="adbarBoost"></div>
        <button class="btn" id="pauseEndBtn">여기서 끝내고 결과 보기</button>
      </section>

      <!-- 결과 -->
      <section class="screen" data-screen="over">
        <div class="card card--accent card--center card--hero celebrate" id="overCard">
          <div class="badge-round" id="overBadge" aria-hidden="true">🎀</div>
          <div class="headline" id="overHeadline">—</div>
          <div class="footnote" id="overSub">—</div>
          <div class="figure figure--result" id="overFigure">—</div>
          <div class="chips" id="overChips"></div>
          <div class="stats stats--inset" id="overTiles"></div>
        </div>

        <div class="card card--info" id="tomorrowCard">
          <div class="card__label">내일 카드</div>
          <p class="footnote" id="tomorrowText">—</p>
        </div>

        <button class="btn btn--primary" id="retryBtn">처음 화면으로</button>
        <div id="adbarStats"></div>
        <div class="footnote--dim center" id="overNote"></div>
      </section>

      <!-- 전체 순위 -->
      <section class="screen" data-screen="stats">
        <div class="card">
          <div class="card__head">
            <span class="card__title" id="statsTitle">전체 통계</span>
          </div>
          <div id="statsChart"></div>
          <div class="stats mt-md" id="statsTiles"></div>
        </div>

        <div class="card card--info">
          <div class="card__label">TOP 20</div>
          <div class="rank-list mt-sm" id="statsRank"></div>
        </div>

        <div class="card card--info">
          <div class="card__label">리그별 기록 수</div>
          <div class="rank-list mt-sm" id="statsLeagues"></div>
        </div>

        <button class="btn" id="statsBackBtn">← 결과로 돌아가기</button>
      </section>

    </main>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
