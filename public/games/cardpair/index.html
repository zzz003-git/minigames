<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- easy2Njoy favicon (2026-09-10) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#E07A1F">
  <link rel="manifest" href="/site.webmanifest">
  <title>카드 짝 맞추기</title>
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#E3ECFA">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Cute+Font&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="../../shared/theme-light.css">
  <link rel="stylesheet" href="theme.css">
  <!-- 카드 그림 — 첫 판에 바로 보이게 미리 불러온다 -->
  <link rel="preload" as="image" href="/games/cardpair/img/card_back.v1.png">
  <link rel="preload" as="image" href="/games/cardpair/img/card_front.v1.png">
</head>
<body class="game game--accent-gold game--cardpair theme-light">
  <script src="../../shared/splash.js"></script>
  <div class="app">
    <header class="topbar" id="header"></header>

    <main class="app__body">

      <!-- 시작 -->
      <section class="screen is-active" data-screen="ready">
        <div class="card card--accent card--center card--hero">
          <div class="card__label card__label--mono">MEMORY PAIRS</div>
          <div class="headline">적게 뒤집을수록 상위</div>
          <p class="footnote">4×4, 여덟 쌍. 카드 배치는 서버에만 있어서 미리 볼 수 없습니다.</p>
        </div>

        <div class="stats">
          <div class="stat stat--accent">
            <div class="stat__label">내 최소 뒤집기</div>
            <div class="stat__value" id="bestValue">—</div>
          </div>
          <div class="stat">
            <div class="stat__label">플레이</div>
            <div class="stat__value" id="playsValue">—</div>
          </div>
        </div>

        <button class="btn btn--primary" id="startBtn" disabled>▶ 시작하기</button>

        <div class="card card--info">
          <div class="meter">
            <div class="meter__text">
              <span class="card__label">오늘 남은 도전</span>
              <span class="figure figure--md" id="attemptText">—</span>
            </div>
            <div class="pips" id="attemptDots"></div>
          </div>
        </div>

        <div id="adbar"></div>
      </section>

      <!-- 플레이 -->
      <section class="screen" data-screen="play">
        <div class="hud">
          <div class="hud__item">
            <span class="hud__label">FLIPS</span>
            <span class="hud__value" id="hudFlips">0</span>
          </div>
          <div class="hud__item">
            <span class="hud__label">맞춘 쌍</span>
            <span class="hud__value hud__value--accent" id="hudPairs">0 / 8</span>
          </div>
          <div class="hud__item hud__item--right">
            <span class="hud__label">시간</span>
            <span class="hud__value" id="hudTime">0:00</span>
          </div>
        </div>

        <div class="stage stage--tight">
          <div class="card-grid" id="cards"></div>
        </div>

        <div id="adbarBoost"></div>
      </section>

      <!-- 결과 -->
      <section class="screen" data-screen="over">
        <div class="card card--accent card--center card--hero celebrate" id="overCard">
          <div class="badge-round" id="overBadge" aria-hidden="true">🎮</div>
          <div class="headline" id="overHeadline">—</div>
          <div class="footnote" id="overSub">—</div>
          <div class="figure figure--result" id="overFigure">—</div>
          <div class="chips" id="overChips"></div>
          <div class="stats stats--inset" id="overTiles"></div>
        </div>

        <button class="btn btn--primary" id="retryBtn">다시 도전하기</button>
        <div id="adbarStats"></div>
        <div class="footnote--dim center" id="overNote"></div>
      </section>

      <!-- 전체 순위 -->
      <section class="screen" data-screen="stats">
        <div class="card">
          <div class="card__head">
            <span class="card__title" id="statsTitle">전체 통계</span>
          </div>
          <div id="statsChart"></div>
          <div class="stats mt-md" id="statsTiles"></div>
        </div>

        <div class="card card--info">
          <div class="card__label">TOP 20</div>
          <div class="rank-list mt-sm" id="statsRank"></div>
        </div>

        <div class="card card--info">
          <div class="card__label">리그별 기록 수</div>
          <div class="rank-list mt-sm" id="statsLeagues"></div>
        </div>

        <button class="btn" id="statsBackBtn">← 결과로 돌아가기</button>
      </section>

    </main>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
