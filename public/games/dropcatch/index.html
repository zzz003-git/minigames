<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- easy2Njoy favicon (2026-09-10) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#E07A1F">
  <link rel="manifest" href="/site.webmanifest">
  <title>와르르 받기</title>
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#BEE3F8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Dongle:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="../../shared/theme-light.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body class="game game--accent-coral game--dropcatch theme-light">
  <script src="../../shared/splash.js"></script>
  <div class="app">
    <header class="topbar" id="header"></header>

    <main class="app__body">

      <!-- 시작 -->
      <section class="screen is-active" data-screen="ready">
        <div class="card card--accent card--center card--hero">
          <div class="card__label card__label--mono">CATCH</div>
          <div class="headline">떨어지는 상품을 받으세요</div>
          <p class="footnote">폭탄만 피하면 됩니다. 폭탄 3개를 받으면 끝나요.<br>처음 10초에는 폭탄이 나오지 않습니다.</p>
        </div>

        <div class="stats">
          <div class="stat stat--accent">
            <div class="stat__label">내 최고 기록</div>
            <div class="stat__value" id="bestValue">—</div>
          </div>
          <div class="stat">
            <div class="stat__label">플레이</div>
            <div class="stat__value" id="playsValue">—</div>
          </div>
        </div>

        <button class="btn btn--primary" id="startBtn" disabled>▶ 시작하기</button>

        <div class="card card--info">
          <div class="meter">
            <div class="meter__text">
              <span class="card__label">오늘 남은 도전</span>
              <span class="figure figure--md" id="attemptText">—</span>
            </div>
            <div class="pips" id="attemptDots"></div>
          </div>
        </div>

        <div id="adbar"></div>
      </section>

      <!-- 플레이 -->
      <section class="screen" data-screen="play">
        <div class="hud">
          <div class="hud__item">
            <span class="hud__label">SCORE</span>
            <span class="hud__value hud__value--accent" id="hudScore">0</span>
          </div>
          <div class="hud__item">
            <span class="hud__label">목숨</span>
            <span class="hud__value" id="hudLives"></span>
          </div>
          <div class="hud__item hud__item--right">
            <span class="hud__label">남은 시간</span>
            <span class="hud__value" id="hudTime">45.0</span>
          </div>
        </div>

        <div class="timebar"><div class="timebar__fill" id="timebar"></div></div>

        <!-- 낙하 무대. 손가락을 대면 바구니가 따라옵니다(탭으로도 이동). -->
        <div class="fallfield" id="field" role="application" aria-label="바구니를 좌우로 움직여 상품을 받으세요">
          <div class="fallfield__combo" id="comboTag" hidden></div>
          <div class="fallfield__items" id="items"></div>
          <div class="fallfield__line" aria-hidden="true"></div>
          <!-- 카트 — 장식. 폭은 theme.css 가 무대의 20%(= 판정 폭 CATCH_HALF×2)로 둔다.
               viewBox 는 카트 실루엣 경계에 딱 맞춰 그림 폭 = 요소 폭이 되게 했다(REQ-56 §3-3) -->
          <div class="basket" id="basket" aria-hidden="true"><svg viewBox="-1 9 148 116" focusable="false">
            <path d="M4 14 H26 L44 88 H128" fill="none" stroke="#D9481F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 14 H22" stroke="#B83A15" stroke-width="9" stroke-linecap="round"/>
            <path d="M30 28 H140 L126 78 H44 Z" fill="#F4F8FB" fill-opacity=".92" stroke="#8C99A6" stroke-width="3" stroke-linejoin="round"/>
            <path d="M62 28 L56 78M82 28 L78 78M102 28 L100 78M122 28 L120 78M34 44 H136M40 62 H131" stroke="#9AA6B2" stroke-width="2.5"/>
            <path d="M30 28 H140" stroke="#D9481F" stroke-width="6" stroke-linecap="round"/>
            <path d="M44 88 L50 98 H122" fill="none" stroke="#8C99A6" stroke-width="4" stroke-linecap="round"/>
            <circle cx="30" cy="28" r="6" fill="#D9481F"/><circle cx="140" cy="28" r="6" fill="#D9481F"/>
            <circle cx="44" cy="80" r="5" fill="#D9481F"/><circle cx="127" cy="80" r="5" fill="#D9481F"/>
            <circle cx="58" cy="112" r="12" fill="#2B3944"/><circle cx="58" cy="112" r="5" fill="#C8D0D8"/>
            <circle cx="118" cy="112" r="12" fill="#2B3944"/><circle cx="118" cy="112" r="5" fill="#C8D0D8"/>
          </svg></div>
        </div>

        <p class="footnote center" id="playHint">화면을 누른 채 좌우로 움직이세요</p>
      </section>

      <!-- 목숨/시간 소진 — 이어받을지 확정할지 -->
      <section class="screen" data-screen="pause">
        <div class="card card--center card--hero">
          <div class="badge-round badge-round--quiet" aria-hidden="true">🛒</div>
          <div class="headline" id="pauseTitle">아쉬워요!</div>
          <div class="footnote" id="pauseSub">—</div>
          <div class="figure figure--result" id="pauseFigure">—</div>
        </div>

        <div id="adbarBoost"></div>
        <button class="btn" id="pauseEndBtn">여기서 끝내고 결과 보기</button>
      </section>

      <!-- 결과 -->
      <section class="screen" data-screen="over">
        <div class="card card--accent card--center card--hero celebrate" id="overCard">
          <div class="badge-round" id="overBadge" aria-hidden="true">🎮</div>
          <div class="headline" id="overHeadline">—</div>
          <div class="footnote" id="overSub">—</div>
          <div class="figure figure--result" id="overFigure">—</div>
          <div class="chips" id="overChips"></div>
          <div class="stats stats--inset" id="overTiles"></div>
        </div>

        <button class="btn btn--primary" id="retryBtn">다시 도전하기</button>
        <div id="adbarStats"></div>
        <div class="footnote--dim center" id="overNote"></div>
      </section>

      <!-- 전체 순위 -->
      <section class="screen" data-screen="stats">
        <div class="card">
          <div class="card__head">
            <span class="card__title" id="statsTitle">전체 통계</span>
          </div>
          <div id="statsChart"></div>
          <div class="stats mt-md" id="statsTiles"></div>
        </div>

        <div class="card card--info">
          <div class="card__label">TOP 20</div>
          <div class="rank-list mt-sm" id="statsRank"></div>
        </div>

        <div class="card card--info">
          <div class="card__label">리그별 기록 수</div>
          <div class="rank-list mt-sm" id="statsLeagues"></div>
        </div>

        <button class="btn" id="statsBackBtn">← 결과로 돌아가기</button>
      </section>

    </main>
  </div>

  <script type="module" src="game.js"></script>
  <script type="module" src="../../shared/bgm.js"></script>
</body>
</html>
