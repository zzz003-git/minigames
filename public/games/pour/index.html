<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>오늘의 한 잔</title>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0F1420">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/base.css">
</head>
<body class="game game--accent-gold">
  <div class="app">
    <header class="topbar" id="header"></header>

    <main class="app__body">

      <!-- 시작 -->
      <section class="screen is-active" data-screen="ready">
        <div class="card card--accent card--center card--hero">
          <div class="card__label card__label--mono">TODAY'S CUP</div>
          <div class="headline">오늘의 한 잔을 만들어요</div>
          <p class="footnote">병을 <b>누르고 있으면</b> 쏟아지고 떼면 멈춥니다.<br><b>목표선</b>에 가깝게 세 층을 쌓으세요.</p>
        </div>

        <div class="stats">
          <div class="stat stat--accent">
            <div class="stat__label">최고 등급</div>
            <div class="stat__value" id="bestValue">-</div>
          </div>
          <div class="stat">
            <div class="stat__label">만든 잔</div>
            <div class="stat__value" id="playsValue">-</div>
          </div>
        </div>

        <button class="btn btn--primary" id="startBtn" disabled>&#9654; 잔 받기</button>

        <div class="card card--info">
          <div class="meter">
            <div class="meter__text">
              <span class="card__label">오늘 남은 잔</span>
              <span class="figure figure--md" id="attemptText">-</span>
            </div>
            <div class="pips" id="attemptDots"></div>
          </div>
          <p class="footnote--dim mt-sm">잔은 매일 밤 12시에 새로 도착합니다. 광고로 잔을 더 받을 수는 없어요.</p>
        </div>

        <div id="adbar"></div>
      </section>

      <!-- 플레이 -->
      <section class="screen" data-screen="play">
        <div class="hud">
          <div class="hud__item">
            <span class="hud__label">층</span>
            <span class="hud__value hud__value--accent" id="hud1">0</span>
          </div>
          <div class="hud__item">
            <span class="hud__label">목표선</span>
            <span class="hud__value" id="hud2">0</span>
          </div>
          <div class="hud__item hud__item--right">
            <span class="hud__label">획득</span>
            <span class="hud__value" id="hud3">0</span>
          </div>
        </div>

        <div class="stage stage--tight cupstage" id="cupStage">
          <div class="cup" id="cup">
            <div class="cup__target" id="cupTarget"><span>목표선</span></div>
            <div class="cup__liquid" id="cupLiquid"></div>
          </div>
          <div class="bottles" id="bottles"></div>
        </div>

        <p class="footnote center" id="playHint">병을 꾹 누르세요</p>
        <div id="adbarPlay"></div>
      </section>

      <!-- 결과 -->
      <section class="screen" data-screen="over">
        <div class="card card--accent card--center card--hero celebrate" id="overCard">
          <div class="badge-round" id="overBadge" aria-hidden="true">&#129380;</div>
          <div class="headline" id="overHeadline">-</div>
          <div class="footnote" id="overSub">-</div>
          <div class="figure figure--result" id="overFigure">-</div>
          <div class="chips" id="overChips"></div>
          <div class="stats stats--inset" id="overTiles"></div>
        </div>
        <div class="card card--info" id="albumCard">
          <div class="card__label">내 앨범</div>
          <p class="footnote" id="albumText">-</p>
        </div>

        <!-- 넘친 판에서만 나오는 구원 광고 자리 (기획서 8장).
             이 컨테이너가 없으면 boostReward 가 조용히 아무 일도 하지 않습니다. -->
        <div id="adbarBoost"></div>

        <button class="btn btn--primary" id="retryBtn">처음 화면으로</button>
        <div id="adbarStats"></div>
        <div class="footnote--dim center" id="overNote"></div>
      </section>

      <!-- 전체 순위 -->
      <section class="screen" data-screen="stats">
        <div class="card">
          <div class="card__head">
            <span class="card__title" id="statsTitle">전체 통계</span>
          </div>
          <div id="statsChart"></div>
          <div class="stats mt-md" id="statsTiles"></div>
        </div>

        <div class="card card--info">
          <div class="card__label">TOP 20</div>
          <div class="rank-list mt-sm" id="statsRank"></div>
        </div>

        <div class="card card--info">
          <div class="card__label">리그별 기록 수</div>
          <div class="rank-list mt-sm" id="statsLeagues"></div>
        </div>

        <button class="btn" id="statsBackBtn">&#8592; 결과로 돌아가기</button>
      </section>

    </main>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
