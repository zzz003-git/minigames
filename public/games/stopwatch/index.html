<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>스탑워치 챌린지</title>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111820">
  <link rel="stylesheet" href="../../shared/base.css">
</head>
<body class="game game--stopwatch">
  <div class="app">
    <header class="topbar" id="header"></header>

    <main class="app__body">

      <!-- 화면① 게임 준비 (랜덤 목표 타임) -->
      <section class="screen is-active" data-screen="ready">
        <div class="card card--accent card--center">
          <div class="card__label">목표 타임</div>
          <div class="figure figure--xl figure--accent mt-sm" id="targetDisplay">—</div>
          <div class="footnote mt-sm">도전마다 새로운 목표 타임이 주어집니다</div>
        </div>

        <button class="btn btn--primary" id="startBtn" disabled>▶ 게임 시작</button>

        <div class="card card--tight">
          <div class="meter-row">
            <span class="card__label">남은 도전 횟수</span>
            <span id="attemptDots"></span>
          </div>
          <div class="meter-row mt-sm">
            <span class="meter-row__text" id="attemptText">불러오는 중…</span>
          </div>
        </div>

        <div id="adbar"></div>
      </section>

      <!-- 화면② 게임 진행 -->
      <section class="screen" data-screen="running">
        <div class="card card--center">
          <div class="card__label" id="runningTarget">목표 —</div>
          <div class="figure figure--xl mt-sm" id="timerMain">0.00</div>
          <div class="figure figure--md dim" id="timerMs">.0</div>
          <div class="footnote mt-md">
            <span class="dot-pulse" aria-hidden="true"></span> 타이머 진행 중
          </div>
        </div>

        <button class="btn btn--primary btn--tall" id="stopBtn">■ STOP</button>
        <div class="footnote center" id="stopHint"></div>
      </section>

      <!-- 화면③ 결과 확인 -->
      <section class="screen" data-screen="result">
        <div class="card card--accent card--center celebrate" id="resultCard">
          <div class="card__label">오차</div>
          <div class="figure figure--xl mt-sm" id="resultGap">—</div>
          <div class="footnote mt-sm">목표 <span id="resultTarget">—</span></div>
        </div>

        <div class="card card--center card--tight">
          <div class="card__label">같은 목표 타임 도전자 중 순위</div>
          <div class="figure figure--lg figure--accent mt-sm" id="resultRank">—</div>
        </div>

        <div id="resultTiles"></div>

        <button class="btn btn--primary" id="retryBtn">▶ 다시 도전하기</button>
        <button class="btn" id="viewStatsBtn">📊 전체 통계 보기</button>
        <div class="footnote center" id="resultNote"></div>

        <div id="adbar2"></div>
      </section>

      <!-- 화면④ 타임별 통계 -->
      <section class="screen" data-screen="stats">
        <div class="card">
          <div class="card__head">
            <span class="card__label" id="statsTitle">전체 통계</span>
          </div>
          <div id="statsChart"></div>
        </div>

        <div class="card card--tight">
          <div class="card__label">나의 기록</div>
          <div class="rank-row is-me mt-sm">
            <span class="rank-row__no">ME</span>
            <span class="rank-row__name" id="statsMyRecord">—</span>
            <span class="rank-row__value" id="statsMyPct">—</span>
          </div>
        </div>

        <div class="card card--tight">
          <div class="card__label">많이 도전된 목표 타임</div>
          <div class="mt-sm" id="statsPopular"></div>
        </div>

        <button class="btn btn--ghost" id="backToResultBtn">← 결과로 돌아가기</button>
      </section>

    </main>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
