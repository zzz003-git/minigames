<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>타이핑 스피드</title>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111820">
  <link rel="stylesheet" href="../../shared/base.css">
</head>
<body class="game game--typing">
  <div class="app">
    <header class="topbar" id="header"></header>

    <main class="app__body">

      <!-- 화면① 설정 선택 -->
      <section class="screen is-active" data-screen="setup">
        <div class="card">
          <div class="stack stack--sm">
            <span class="card__label">난이도</span>
            <div class="seg" id="difficultySeg" role="group" aria-label="난이도 선택"></div>
          </div>
          <div class="stack stack--sm mt-md">
            <span class="card__label">언어</span>
            <div class="seg" id="langSeg" role="group" aria-label="언어 선택"></div>
          </div>
          <div class="footnote mt-md" id="metricHint"></div>
        </div>

        <div class="card">
          <div class="card__label">예시 문장</div>
          <blockquote class="quote mt-sm" id="preview">문장을 불러오는 중…</blockquote>
        </div>

        <div class="summary" id="selectionSummary"></div>
        <button class="btn btn--primary" id="startBtn">▶ 게임 시작</button>

        <div class="card card--tight">
          <div class="meter-row">
            <span class="card__label">남은 도전 횟수</span>
            <span id="attemptDots"></span>
          </div>
          <div class="meter-row mt-sm">
            <span class="meter-row__text" id="attemptText">불러오는 중…</span>
          </div>
        </div>

        <div id="adbar"></div>
      </section>

      <!-- 카운트다운 -->
      <section class="screen" data-screen="countdown">
        <div class="card card--accent card--center">
          <div class="card__label">곧 시작합니다</div>
          <div class="figure figure--xl figure--accent mt-sm" id="countdownNum">3</div>
          <div class="footnote mt-sm">문장을 눈으로 먼저 읽어 두세요</div>
        </div>

        <div class="card">
          <div class="card__label">도전 문장</div>
          <blockquote class="quote mt-sm" id="countdownText"></blockquote>
        </div>
      </section>

      <!-- 화면② 타이핑 진행 -->
      <section class="screen" data-screen="play">
        <div class="card card--tight">
          <div id="liveTiles" class="stats">
            <div class="stat">
              <div class="stat__value" id="liveSpeed">0</div>
              <div class="stat__label" id="liveSpeedLabel">WPM</div>
            </div>
            <div class="stat stat--accent">
              <div class="stat__value" id="liveAcc">100%</div>
              <div class="stat__label">정확도</div>
            </div>
            <div class="stat">
              <div class="stat__value" id="liveLeft">0:00</div>
              <div class="stat__label">남은 시간</div>
            </div>
          </div>
          <div class="progress mt-md"><div class="progress__fill" id="progressFill"></div></div>
        </div>

        <div class="card">
          <div class="card__label">따라 칠 문장</div>
          <div class="typing-target mt-sm" id="targetText"></div>
        </div>

        <div class="card">
          <div class="card__label">입력</div>
          <textarea class="typing-input mt-sm" id="typingInput" rows="3" autocomplete="off"
                    autocorrect="off" autocapitalize="off" spellcheck="false"
                    placeholder="여기에 입력하세요"></textarea>
          <div class="footnote mt-sm">
            정확한 글자는 초록, 오탈자는 빨강으로 표시됩니다 · 백스페이스로 수정 가능
          </div>
        </div>

        <button class="btn" id="finishBtn">입력 완료</button>
      </section>

      <!-- 화면③ 결과 확인 -->
      <section class="screen" data-screen="result">
        <div class="card card--accent card--center celebrate" id="resultCard">
          <div class="card__label">최종 점수</div>
          <div class="figure figure--xl figure--accent mt-sm" id="resultScore">—</div>
          <div class="footnote mt-sm">지표 × 정확도%</div>
        </div>

        <div id="resultTiles"></div>

        <div class="card card--center card--tight">
          <div class="card__label" id="resultRankLabel">전체 순위</div>
          <div class="figure figure--lg mt-sm" id="resultRank">—</div>
        </div>

        <button class="btn btn--primary" id="retryBtn">🔄 다시 도전하기</button>
        <button class="btn" id="viewRankBtn">🏆 전체 순위 보기</button>
        <button class="btn btn--ghost" id="newSentenceBtn">📄 새 문장 도전권 받기</button>
        <div class="footnote center" id="resultNote"></div>

        <div id="adbar2"></div>
      </section>

      <!-- 화면④ 전체 순위 -->
      <section class="screen" data-screen="rank">
        <div class="card">
          <div class="card__label" id="rankTitle">전체 순위</div>
          <div class="rank-list mt-sm" id="rankList"></div>
        </div>

        <div class="card">
          <div class="card__label">조건별 평균</div>
          <div class="rank-list mt-sm" id="bucketList"></div>
        </div>

        <button class="btn btn--ghost" id="rankBackBtn">← 결과로 돌아가기</button>
      </section>

    </main>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
