<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- easy2Njoy favicon (2026-09-10) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#E07A1F">
  <link rel="manifest" href="/site.webmanifest">
  <title>순간 개수 세기</title>
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F4A57C">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Poor+Story&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="../../shared/theme-light.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body class="game game--accent-coral game--countdot theme-light">
  <script src="../../shared/splash.js"></script>
  <div class="app">
    <header class="topbar" id="header"></header>

    <main class="app__body">

      <!-- 시작 -->
      <section class="screen is-active" data-screen="ready">
        <div class="card card--accent card--center card--hero">
          <div class="card__label card__label--mono">SUBITIZE</div>
          <div class="headline">콩이 몇 알이었나요?</div>
          <p class="footnote">0.4초만 보여줍니다. 라운드가 올라갈수록 콩이 늘고 더 짧아져요. 목숨 3개.</p>
        </div>

        <div class="stats">
          <div class="stat stat--accent">
            <div class="stat__label">최고 라운드</div>
            <div class="stat__value" id="bestValue">—</div>
          </div>
          <div class="stat">
            <div class="stat__label">플레이</div>
            <div class="stat__value" id="playsValue">—</div>
          </div>
        </div>

        <button class="btn btn--primary" id="startBtn" disabled>▶ 시작하기</button>

        <div class="card card--info">
          <div class="meter">
            <div class="meter__text">
              <span class="card__label">오늘 남은 도전</span>
              <span class="figure figure--md" id="attemptText">—</span>
            </div>
            <div class="pips" id="attemptDots"></div>
          </div>
        </div>

        <div id="adbar"></div>
      </section>

      <!-- 플레이 -->
      <section class="screen" data-screen="play">
        <div class="hud">
          <div class="hud__item">
            <span class="hud__label">ROUND</span>
            <span class="hud__value" id="hudRound">1</span>
          </div>
          <div class="lives" id="hudLives"></div>
          <div class="hud__item hud__item--right">
            <span class="hud__label">공개</span>
            <span class="hud__value hud__value--accent" id="hudExpose">—</span>
          </div>
        </div>

        <div class="stage stage--tight cd-stage" id="cdStage">
          <div class="dot-field" id="field">
            <div class="dot-field__msg" id="fieldMsg">준비…</div>
          </div>
          <!-- 은색 덮개 — 장식입니다. 점(콩)은 덮개가 아니라 clear(field) 로 지웁니다(REQ-56 §3-1).
               테마 CSS 가 없으면 이 그림은 숨은 채로 있고, 게임은 지금과 똑같이 돕니다 -->
          <svg class="cd-cloche" viewBox="0 0 240 200" aria-hidden="true" focusable="false">
            <defs><linearGradient id="cdSilver" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8E959C"/><stop offset=".25" stop-color="#EEF1F3"/><stop offset=".5" stop-color="#C5CBD1"/><stop offset=".8" stop-color="#9AA1A8"/><stop offset="1" stop-color="#6F767D"/></linearGradient></defs>
            <path d="M14 168 C14 70 62 30 120 30 C178 30 226 70 226 168Z" fill="url(#cdSilver)" stroke="#3D434A" stroke-width="4"/>
            <path d="M46 150 C48 96 74 62 108 52" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".75"/>
            <rect x="6" y="164" width="228" height="20" rx="10" fill="#B9C0C7" stroke="#3D434A" stroke-width="4"/>
            <rect x="100" y="12" width="40" height="22" rx="8" fill="#9AA1A8" stroke="#3D434A" stroke-width="4"/>
            <circle cx="120" cy="12" r="10" fill="url(#cdSilver)" stroke="#3D434A" stroke-width="4"/>
          </svg>
        </div>

        <div class="sheet">
          <div class="sheet__grip" aria-hidden="true"></div>
          <div class="sheet__head">
            <span class="card__label" id="inputLabel">본 콩알 개수를 눌러 주세요</span>
            <span class="figure figure--sm" id="inputValue">—</span>
          </div>
          <div class="numpad" id="numpad"></div>
        </div>
      </section>

      <!-- 목숨 소진 -->
      <section class="screen" data-screen="pause">
        <div class="card card--center card--hero">
          <div class="badge-round badge-round--quiet" aria-hidden="true">💔</div>
          <div class="headline">아깝다!</div>
          <div class="footnote" id="pauseSub">—</div>
          <div class="figure figure--result" id="pauseFigure">—</div>
        </div>

        <div id="adbarBoost"></div>
        <button class="btn" id="pauseEndBtn">여기서 끝내고 결과 보기</button>
      </section>

      <!-- 결과 -->
      <section class="screen" data-screen="over">
        <div class="card card--accent card--center card--hero celebrate" id="overCard">
          <div class="badge-round" id="overBadge" aria-hidden="true">🎮</div>
          <div class="headline" id="overHeadline">—</div>
          <div class="footnote" id="overSub">—</div>
          <div class="figure figure--result" id="overFigure">—</div>
          <div class="chips" id="overChips"></div>
          <div class="stats stats--inset" id="overTiles"></div>
        </div>

        <button class="btn btn--primary" id="retryBtn">다시 도전하기</button>
        <div id="adbarStats"></div>
        <div class="footnote--dim center" id="overNote"></div>
      </section>

      <!-- 전체 순위 -->
      <section class="screen" data-screen="stats">
        <div class="card">
          <div class="card__head">
            <span class="card__title" id="statsTitle">전체 통계</span>
          </div>
          <div id="statsChart"></div>
          <div class="stats mt-md" id="statsTiles"></div>
        </div>

        <div class="card card--info">
          <div class="card__label">TOP 20</div>
          <div class="rank-list mt-sm" id="statsRank"></div>
        </div>

        <div class="card card--info">
          <div class="card__label">리그별 기록 수</div>
          <div class="rank-list mt-sm" id="statsLeagues"></div>
        </div>

        <button class="btn" id="statsBackBtn">← 결과로 돌아가기</button>
      </section>

    </main>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
