<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>오늘의선택</title>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0F1420">
  <meta name="description" content="오늘의 실험 한 봉투. 90초면 오늘의 마음이 나옵니다.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="mind.css">
</head>
<body class="game suite suite--mind">
  <div id="siteNav"></div>
  <div class="app">
    <header class="topbar" id="header"></header>

    <main class="app__body">

      <!-- 홈 — 오늘의 봉투 -->
      <section class="screen is-active" data-screen="home">
        <div class="envelope" id="envelope" role="button" tabindex="0"
             aria-label="오늘의 실험 봉투를 엽니다">
          <div class="envelope__glyph" id="envGlyph">✉️</div>
          <div class="envelope__title" id="envTitle">오늘의 실험</div>
          <div class="envelope__sub" id="envSub">봉투를 열어 보세요</div>
        </div>

        <div class="stats">
          <div class="stat stat--accent">
            <div class="stat__label">마음 지도</div>
            <div class="stat__value" id="mapValue">—</div>
          </div>
          <div class="stat">
            <div class="stat__label">도감</div>
            <div class="stat__value" id="collValue">—</div>
          </div>
        </div>

        <button class="btn" id="mapBtn">마음 지도 보기</button>
        <div id="adbarArchive"></div>
        <p class="footnote--dim center" id="homeNote">오락용이에요 — 심리학적 진단이 아닙니다</p>
      </section>

      <!-- 장면 -->
      <section class="screen" data-screen="scene">
        <div class="card card--accent card--center card--hero">
          <div class="scene__glyph" id="sceneGlyph">🛋️</div>
          <div class="headline" id="sceneTitle">—</div>
          <p class="scene__text" id="sceneText">—</p>
        </div>
        <button class="btn btn--primary" id="sceneStartBtn">시작하기</button>
      </section>

      <!-- 문항 -->
      <section class="screen" data-screen="quiz">
        <div class="qbar"><span id="qbarFill"></span></div>
        <p class="qstep" id="qStep">1 / 4</p>
        <div class="card card--center">
          <div class="qtext" id="qText">—</div>
        </div>
        <div class="opts" id="opts"></div>
      </section>

      <!-- 결과 -->
      <section class="screen" data-screen="result">
        <div class="card card--accent card--center card--hero" id="resultCard">
          <div class="type__glyph" id="typeGlyph">🛌</div>
          <div class="headline" id="typeName">—</div>
          <p class="type__desc" id="typeDesc">—</p>
        </div>

        <div class="card card--info">
          <div class="card__label">마음 지도</div>
          <p class="footnote" id="axisEcho">—</p>
          <div class="axisbars" id="axisBars"></div>
        </div>

        <div class="card card--info">
          <div class="card__label">오늘의 적립</div>
          <p class="footnote" id="resGain">—</p>
          <p class="footnote--dim mt-sm" id="resDist">전국 분포는 광고를 보면 열려요</p>
        </div>

        <!-- 전국 추측 — 점수도 보상도 저장도 없다 (M-01) -->
        <div class="card card--info" id="guessCard">
          <div class="card__label">전국 추측</div>
          <p class="footnote" id="guessQ">—</p>
          <div class="opts opts--tight" id="guessOpts"></div>
          <p class="footnote--dim mt-sm">이 답은 <b>기록되지 않아요</b>. 재미로만 물어봅니다</p>
        </div>

        <div id="adbarStats"></div>
        <div class="crosschips" id="crossChips"></div>
        <button class="btn" id="collBtn">도감 보기</button>
        <div class="footnote--dim center" id="resNote"></div>
      </section>

      <!-- 마음 지도 -->
      <section class="screen" data-screen="map">
        <div class="card">
          <div class="card__head"><span class="card__title" id="mapTitle">마음 지도</span></div>
          <div class="axisbars" id="mapBars"></div>
          <p class="footnote--dim mt-md" id="mapNote">—</p>
        </div>
        <button class="btn" id="mapBackBtn">← 돌아가기</button>
      </section>

      <!-- 도감 -->
      <section class="screen" data-screen="coll">
        <div class="card">
          <div class="card__head"><span class="card__title" id="collTitle">도감</span></div>
          <div class="collrows" id="collRows"></div>
        </div>
        <button class="btn" id="collBackBtn">← 돌아가기</button>
      </section>

    </main>
  </div>

  <script type="module" src="mind.js"></script>
</body>
</html>
