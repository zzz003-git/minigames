<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>인스턴트 미니게임</title>
  <meta name="description" content="스탑워치 · 숫자야구 · 타이핑 · 숫자기억력 미니게임 4종">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0F1420">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/base.css">
</head>
<body>
  <main class="hub">
    <header class="hub__header">
      <h1>인스턴트 미니게임</h1>
      <p class="subtext">하고 싶은 게임을 골라보세요</p>
    </header>

    <nav class="hub__grid">
      <a class="hub-card" href="games/stopwatch/"
         style="--card-accent:#7FD8C0; --card-soft:rgba(127,216,192,.12)">
        <span class="hub-card__icon" aria-hidden="true">⏱</span>
        <span class="hub-card__text">
          <span class="hub-card__title">스탑워치 챌린지</span>
          <span class="hub-card__desc">목표 시간에 정확히 맞춰 멈추기</span>
          <span class="hub-card__meta">1.00~9.99초 · 타임별 순위</span>
        </span>
        <span class="hub-card__go" aria-hidden="true">›</span>
      </a>

      <a class="hub-card" href="games/baseball/"
         style="--card-accent:#E9927F; --card-soft:rgba(233,146,127,.12)">
        <span class="hub-card__icon" aria-hidden="true">⚾</span>
        <span class="hub-card__text">
          <span class="hub-card__title">숫자야구</span>
          <span class="hub-card__desc">3자리 숫자를 스트라이크·볼 힌트로 추리하기</span>
          <span class="hub-card__meta">기본 6회 · 전략 퍼즐</span>
        </span>
        <span class="hub-card__go" aria-hidden="true">›</span>
      </a>

      <a class="hub-card" href="games/typing/"
         style="--card-accent:#D6B166; --card-soft:rgba(214,177,102,.12)">
        <span class="hub-card__icon" aria-hidden="true">⌨</span>
        <span class="hub-card__text">
          <span class="hub-card__title">타이핑 챌린지</span>
          <span class="hub-card__desc">제시 문장을 빠르고 정확하게 입력하기</span>
          <span class="hub-card__meta">한국어 · English · 혼합</span>
        </span>
        <span class="hub-card__go" aria-hidden="true">›</span>
      </a>

      <a class="hub-card" href="games/memory/"
         style="--card-accent:#7FD8C0; --card-soft:rgba(127,216,192,.12)">
        <span class="hub-card__icon" aria-hidden="true">🧠</span>
        <span class="hub-card__text">
          <span class="hub-card__title">숫자 기억력</span>
          <span class="hub-card__desc">잠깐 보여준 숫자를 기억해서 입력하기</span>
          <span class="hub-card__meta">LV1~10 · 4~13자리</span>
        </span>
        <span class="hub-card__go" aria-hidden="true">›</span>
      </a>
    </nav>

    <footer class="hub__footer">
      <a href="https://github.com/zzz00321-boop/minigames">소스 코드</a>
    </footer>
  </main>
</body>
</html>
