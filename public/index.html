<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>미니게임 라운지</title>
  <meta name="description" content="스탑워치 · 숫자야구 · 타이핑 · 숫자기억력 미니게임 4종">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111820">
  <link rel="stylesheet" href="shared/base.css">
</head>
<body>
  <main class="hub">
    <header class="hub__header">
      <h1>미니게임 라운지</h1>
      <p class="subtext">짧게 즐기는 네 가지 기록 도전</p>
    </header>

    <nav class="hub__grid">
      <a class="hub-card" href="games/stopwatch/"
         style="--card-accent:#69c7b3; --card-soft:rgba(105,199,179,.12); --card-line:rgba(105,199,179,.32)">
        <span class="hub-card__icon" aria-hidden="true">⏱</span>
        <span>
          <span class="hub-card__title">스탑워치 챌린지</span>
          <span class="hub-card__desc">랜덤으로 정해진 목표 시간에 정확히 맞춰 멈추기</span>
          <span class="hub-card__meta">1.00–9.99초 · 오차 0.001초</span>
        </span>
      </a>

      <a class="hub-card" href="games/baseball/"
         style="--card-accent:#f0957f; --card-soft:rgba(240,149,127,.12); --card-line:rgba(240,149,127,.32)">
        <span class="hub-card__icon" aria-hidden="true">⚾</span>
        <span>
          <span class="hub-card__title">숫자야구</span>
          <span class="hub-card__desc">스트라이크와 볼 힌트로 세 자리 숫자를 추리하기</span>
          <span class="hub-card__meta">3자리 · 기본 6회</span>
        </span>
      </a>

      <a class="hub-card" href="games/typing/"
         style="--card-accent:#e7c878; --card-soft:rgba(231,200,120,.12); --card-line:rgba(231,200,120,.32)">
        <span class="hub-card__icon" aria-hidden="true">⌨</span>
        <span>
          <span class="hub-card__title">타이핑 스피드</span>
          <span class="hub-card__desc">제시된 문장을 빠르고 정확하게 입력하기</span>
          <span class="hub-card__meta">3개 언어 · 275문장</span>
        </span>
      </a>

      <a class="hub-card" href="games/memory/"
         style="--card-accent:#a99ae8; --card-soft:rgba(169,154,232,.12); --card-line:rgba(169,154,232,.32)">
        <span class="hub-card__icon" aria-hidden="true">🧠</span>
        <span>
          <span class="hub-card__title">숫자 기억력</span>
          <span class="hub-card__desc">잠깐 보여준 숫자를 가린 뒤 그대로 입력하기</span>
          <span class="hub-card__meta">LV1–10 · 4–13자리</span>
        </span>
      </a>
    </nav>

    <footer class="hub__footer">
      <a href="https://github.com/zzz00321-boop/minigames">소스 코드</a>
    </footer>
  </main>
</body>
</html>
